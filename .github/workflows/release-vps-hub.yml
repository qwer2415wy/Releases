name: release vps-hub

# Builds vps-hub from the private source branch and publishes the archives as a
# release of this public repository, tagged vps-hub-vX.Y.Z.
#
# Logs here are public, so every command that could quote source code writes to a
# file that is never printed or uploaded. To see why a step failed, run the same
# command on your own machine.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.3.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-vps-hub

env:
  SOURCE_REPO: qwer2415wy/tools
  SOURCE_REF: vps-hub

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # a cache in a public repository would hold private build output
      - name: Test (output hidden)
        run: |
          go vet ./... >"$RUNNER_TEMP/log" 2>&1 || { echo "go vet failed"; exit 1; }
          go test ./... >"$RUNNER_TEMP/log" 2>&1 || { echo "go test failed"; exit 1; }
          /bin/bash -n install/install.sh 2>"$RUNNER_TEMP/log" || { echo "bash 3.2 parse failed"; exit 1; }

  release:
    needs: test-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 1.2.3"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.TOOLS_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test (output hidden)
        run: |
          go vet ./... >"$RUNNER_TEMP/log" 2>&1 || { echo "go vet failed"; exit 1; }
          # On failure print names only: packages, tests and the number of races.
          go test -race ./... >"$RUNNER_TEMP/log" 2>&1 || {
            echo "go test failed"
            grep -E '^[[:space:]]*--- FAIL: |^FAIL|^panic: test timed out' "$RUNNER_TEMP/log" | awk '{print $1, $2, $3}'
            echo "data races: $(grep -c 'WARNING: DATA RACE' "$RUNNER_TEMP/log")"
            exit 1
          }
          shellcheck install/install.sh >"$RUNNER_TEMP/log" 2>&1 || { echo "shellcheck failed"; exit 1; }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Build (output hidden)
        run: |
          GORELEASER_CURRENT_TAG="v$VERSION" goreleaser release --clean --skip=publish,validate,announce \
            >"$RUNNER_TEMP/log" 2>&1 || { echo "build failed"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "vps-hub-v$VERSION" dist/*.tar.gz dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "vps-hub $VERSION" --notes "vps-hub $VERSION"
